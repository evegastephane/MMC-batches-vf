[package]
name = "mmc-batch-vf"
version = "0.1.0"
description = "Transforme une liste de numéros Excel en fichier CSV"
authors = ["MMC"]
edition = "2021"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows
# (voir https://github.com/rust-lang/cargo/issues/8519).
name = "mmc_batch_vf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
calamine = "0.36"
serde = { version = "1.0.229", features = ["derive"] }
# Types d'en-tête enregistrés en JSON dans la base.
serde_json = "1"
# Historique des lots : SQLite embarqué (bundled) + lecture/écriture en flux des CSV (blob).
rusqlite = { version = "0.40", features = ["bundled", "blob"] }

# Voir https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
